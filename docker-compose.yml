# Optional local Data tier. Requires Docker Desktop.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurelia-hrms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia
      POSTGRES_DB: aurelia_hrms
    ports:
      - "5432:5432"
    volumes:
      - aurelia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia -d aurelia_hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurelia_pg_data:
